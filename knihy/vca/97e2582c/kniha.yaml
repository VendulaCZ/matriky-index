nazev: "Sbírka matrik Východočeského kraje, sign.: 25-6 (poř.č. 1716), 6.1808-4.1839 – římskokatolická matrika ZEMŘELÝCH, Dobré + Dolní Spáleniště + Hlinné + Chmeliště + Kamenice + Lomy + Netřeba + Osečnice + Petrovice + Rovenské Šediviny + Rovné + Sekyrka + Skutina + Žákovec + Živina"
obsah: "85 snímků; smíšená matrika celé farnosti („Ort Dobrey samt einverleibten Ortschaften“), obec v prvním sloupci pod datem; sloupce datum a obec – č. domu – jméno, kdo zaopatřil a pohřbil – vyznání, pohlaví, věk – nemoc a pořadové číslo; stránkováno „Pag.“: sn. n L = Pag. 2(n−5), sn. n P = Pag. 2(n−5)+1 (ověřeno sn. 8, 13, 17, 43, 55); snímek = pořadí snímku v ARON"
