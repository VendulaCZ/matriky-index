nazev: "Sbírka matrik Východočeského kraje, sign.: 171-10 (poř.č. 12195), 1724-1799 – římskokatolický index NAROZENÝCH, ZEMŘELÝCH, ODDANÝCH (farnost Bělá, Benátky, Bukový, Hutě, Kamenec, Malý Uhřínov, Podolí, Tisovec, Velký Uhřínov)"
obsah: "63 snímků; rejstřík po písmenech, sloupce jméno – den a měsíc – rok (jen při změně) – folio: narození sn. 21–33 (každé písmeno ve dvou blocích: 1753–1784 = folia knihy 171-2, 1785–1799 = folia obecních oddílů, číslování od 1; sn. 25 P = G, sn. 26 P = K, sn. 27 L = K 1785–1799), oddaní podle ženicha sn. 34–38 (sn. 35 = G a K), zemřelí sn. 39–46 (sn. 41 L = G); folio = číslo listu, psané vpravo nahoře na pravé straně dvojstrany, zápis může být na předchozí straně; snímek = pořadí snímku v ARON"
