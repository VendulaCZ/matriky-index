nazev: "Sbírka matrik Východočeského kraje, sign.: 14-6104 (poř.č. 720), 1838-1909 – římskokatolická matrika ZEMŘELÝCH, římskokatolický index ZEMŘELÝCH, Ohnišov"
obsah: "155 snímků; matrika zemřelých obce Ohnišov: sn. 3 desky, sn. 4 P titul „Sterbmatrik des Dorfes Wohnischow vom Jahre 1838“ (fol. 1), zápisy od sn. 5 P (německy do asi 1850, od 1849/50 česky; sloupce rok, měsíc, den – č. domu – jméno – vyznání, pohlaví – věk – nemoc); sn. 100 = r. 1898; strany: sn. n L = s. 2(n−5), sn. n P = s. 2(n−5)+1 (ověřeno sn. 21, 26, 33, 34, 54; od asi s. 100 se číslování posouvá); vzadu rejstřík zemřelých po písmenech („Alphabetischer Index über das Sterbregister“; sloupce jméno – den – rok – matrika – strana): sn. 130 P = E, sn. 137 P–139 L = K, sn. 141 P–142 L = M, sn. 145 P = P, sn. 150 = S/T; snímek = pořadí snímku v ARON"
