nazev: "Sbírka matrik Východočeského kraje, sign.: 136-11 (poř.č. 9215), 1707-1759 – Přepychy O+Z (římskokatolická matrika ZEMŘELÝCH, ODDANÝCH, farnost Přepychy: Bolehošť, Bolehošťská Lhota, Čánka, Dobříkovec, Křivice, Lipiny, Mokré, Nová Ves, Přepychy, Zádolí, Záhornice; O 1707-9.1759, Z 1707-9.1758; filiální obvod Opočno: Opočno, Pohoří, Puličky, Semechnice, Trnov; O 1707-10.1723, Z 1707-8.1723; fol. 112 sumář svátostí 1724-1727, 1741-1746)"
obsah: "223 snímků; sn. 1 = volný list, sn. 2 = archivní štítek, sn. 3 = hřbet; ODDANÍ sn. 4 P – 114 L (Přepychy a obce farnosti, v letech 1707–X/1723 smíšeně s filiálním obvodem Opočno; ves v marginále, folio vpravo nahoře ≈ sn. − 3: sn. 4 P = fol. 1/I.1707, 6 P = 1708, 8 P = 1709, 10 L = 1710, 13 L = 1711, 15 P = 1712, 17 L = 1713, 18 L = 1714, 20 P = 1715 (odtud latinsky), 23 L = 1716, 26 L = 1717, 28 P = 1718, 30 P = 1719, 33 L = 1720, 35 L = 1721, 36 L = 1722, 38 P = 1723, 40 P = XI/1723–I/1724; konec oddaných sn. 114 L); sn. 115 L = souhrnná tabulka „Anni 1725–1746: Copulati, Baptisati, Sepulti“; ZEMŘELÍ sn. 115 P – asi 221 (1707–1758, do VII/1723 smíšeně s opočenským obvodem; folio ≈ sn. − 114: sn. 115 P = fol. 1/I.1707, 118 P = 1708, 121 L = 1709, 122 P = 1710, 125 L = 1711, 127 L = 1712, 130 L = 1713, 132 P = 1714, 136 L = 1715 (odtud latinsky), 139 L = 1716, 141 P = 1717, 145 L = 1718, 147 L = 1719, 150 L = 1720, 153 P = 1721, 155 P = 1722, 157 P = 1723, 158 P = 1724; sn. 220 = I/1758 fol. 96; sn. 223 = konec); snímek = pořadí snímku v ARON"
