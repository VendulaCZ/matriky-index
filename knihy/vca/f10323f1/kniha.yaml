nazev: "Sbírka matrik Východočeského kraje, sign.: 25-7 (poř.č. 1732), 1787-1839 – římskokatolický index NAROZENÝCH, ZEMŘELÝCH, ODDANÝCH, farnost (Dobré, Dolní Spáleniště, Hlinné, Chmeliště, Kamenice, Lomy, Netřeba, Osečnice, Petrovice, Rovenské Šediviny, Rovné, Sekyrka, Skutina, Žákovec, Živina); NZ 1787-1817, O 1787-1839"
obsah: "87 snímků; rejstřík po písmenech (narození, zemřelí do 1817, oddaní), u zemřelých sloupce jméno – obec – folio; zápisy bez roku patří staré matrice 25-5 (folio = číslo strany oddílu obce), od 1808 „w nowé Matrice“ 25-6 (folio = Pag.); u zemřelých 1808–1817 jsou sloupce obec a folio proti jménům posunuty o jeden řádek dolů; zemřelí Litt. S sn. 77 P–78 L (Litt. Š zvlášť, sn. 79–81 L); snímek = pořadí snímku v ARON"
