nazev: "Sbírka matrik Východočeského kraje, sign.: 25-5 (poř.č. 1715), 1784-1808 – římskokatolická matrika ZEMŘELÝCH, Dobré (6.1784-4.1808), Hlinné (5.1784-5.1808), Kamenice (5.1784-4.1808), Lomy (8.1784-4.1808), Netřeba (12.1786-2.1807), Rovné (5.1784-3.1808), Dolní Spáleniště (9.1784-7.1807), Osečnice (5.1784-5.1808), Žákovec (4.1785-10.1806)"
obsah: "65 snímků; zemřelí po obcích farnosti: Dobré sn. 4–19, Hlinné od sn. 20 P, Kamenice sn. 31 P–36 L (s. 1–10, 1784–IV/1808), Lomy od sn. 37 P, Netřeba od sn. 43 P; „f.“ v rohu = číslo strany oddílu obce; v oddíle Kamenice s. 1 = sn. 31 P, s. 2 = 32 L, s. 3 = 32 P, … s. 10 = 36 L; snímek = pořadí snímku v ARON"
