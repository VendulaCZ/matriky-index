nazev: "Sbírka matrik Východočeského kraje, sign.: 25-1 (poř.č. 1680), 1784-1808 – římskokatolická matrika NAROZENÝCH, Dobré (5.1784-5.1808), Hlinné (6.1784-5.1808), Kamenice (6.1784-5.1808), Lomy (9.1784-5.1808), Netřeba (5.1784-1.1808), Rovné (5.1784-5.1808), Dolní Spáleniště (5.1784-5.1808), Osečnice (6.1784-5.1808), Žákovec (8.1784-6.1808)"
obsah: "150 snímků; kniha po obcích, každý oddíl s vlastním číslováním f.: oddíl Dobré od sn. 4 P (titul „N. I. Matrica Baptizatorum“, nápis „DOBRÉ 25/1“; sn. 6 = f. 2/3 (IX/1784), sn. 8 = f. 6/7 (1786), sn. 10 = f. 10/11 (1787), sn. 12 = f. 14/15 (1788), sn. 14 = f. 18/19 (1789)); oddíl Kamenice od sn. 75 (f. 1 L, nadpis „Kamenice 1784 Junius“; L liché, P sudé číslo: sn. 76 = f. 3/4, sn. 77 = f. 5/6, sn. 78 = f. 7/8, sn. 79 = f. 9/10, sn. 80 = f. 11/12); sn. 74 = f. 59/60 jiných obcí, rok 1808; sloupce měsíc a den | No. domu | jméno | pohlaví/legitimita | Otec | Mateř | Kmotři Gméno | Stav; snímek = pořadí snímku v ARON"
